[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runpod-experiments-system"
version = "0.2.0.dev0"
description = "Shared controls and result collection for RunPod research experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
runpod-experiment-supervisor = "runpod_experiments.supervisor_process:main"

[tool.setuptools.packages.find]
include = ["runpod_experiments*"]
